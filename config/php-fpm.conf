; Pool of the panel behind Caddy (bin/caddy.sh). It runs as root like the queue workers: requests
; reach the local node through nsenter and write the files composer installed as root.
[www]
user = root
group = root
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; package installations and updates run composer inside a request
request_terminate_timeout = 0
php_value[max_execution_time] = 900

; composer changes files while the panel runs: no request may see cached code of before
php_admin_value[opcache.revalidate_freq] = 0
